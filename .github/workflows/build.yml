name: Listeleri doğrula

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Listeleri üret
        run: node scripts/build.mjs
      - name: Üretilen dosyalar güncel mi?
        run: |
          # git status yeni (untracked) ve silinen dosyaları da gösterir; git diff göstermez.
          changes="$(git status --porcelain -- README.md categories platforms licenses lists)"
          if [ -n "$changes" ]; then
            echo "$changes"
            git diff -- README.md categories platforms licenses lists
            echo "::error::data/ değişti ama 'node scripts/build.mjs' çalıştırılmamış."
            exit 1
          fi
